<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Bedazzled by Adepa</title>

    <link rel="stylesheet" href="style.css">
    <div class="admin-nav-actions">

    <a href="index.html" class="nav-button">
        View Website
    </a>

    <button id="logoutButton" class="logout-button">
        Logout
    </button>

</div>

</head>


<body class="login-page">

    <main class="login-container">

        <div class="login-box">

            <p class="eyebrow">
                BEDAZZLED BY ADEPA
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="login-description">
                Sign in to manage appointments and
                website content.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="login.js"></script>

</body>

</html>
